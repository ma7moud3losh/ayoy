<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>لوحة الأدمن - العروض</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Tajawal',sans-serif;padding:20px;background:#fdf4f2;}
input, textarea{width:100%;padding:8px;margin-bottom:10px;border:1px solid #ccc;border-radius:5px}
button{padding:10px 15px;background:#d97706;color:#fff;border:none;border-radius:5px;cursor:pointer}
h2{margin-bottom:20px}
</style>
</head>
<body>

<h2>إضافة عرض جديد</h2>

<input type="text" id="offerTitle" placeholder="عنوان العرض">
<textarea id="offerDesc" placeholder="وصف العرض"></textarea>
<input type="number" id="offerDiscount" placeholder="نسبة الخصم">
<input type="file" id="offerImageFile">
<button onclick="addOffer()">إضافة العرض</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabaseUrl = "https://qccpddjnozehorhleegz.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFjY3BkZGpub3plaG9yaGxlZWd6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM2MTc0NzEsImV4cCI6MjA3OTE5MzQ3MX0.WzG0u9c6wY9eTTh0olIzrPSSPoHhuQhmLTS7zPxXBGA";
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

async function addOffer() {
  const title = document.getElementById("offerTitle").value.trim();
  const description = document.getElementById("offerDesc").value.trim();
  const discount = document.getElementById("offerDiscount").value;
  const imageFile = document.getElementById("offerImageFile").files[0];

  if(!title || !description){
    alert("من فضلك اكتب العنوان والوصف");
    return;
  }

  let image_url = null;

  if(imageFile){
    try{
      const fileExt = imageFile.name.split('.').pop();
      const fileName = `${Date.now()}.${fileExt}`;

      // رفع الصورة إلى Supabase Storage
      const { data, error: uploadError } = await supabase.storage
        .from('offers-images')
        .upload(fileName, imageFile);

      if(uploadError){
        console.error(uploadError);
        alert("❌ خطأ أثناء رفع الصورة");
        return;
      }

      // الحصول على الرابط العام للصورة
      const { publicUrl, error: urlError } = supabase.storage
        .from('offers-images')
        .getPublicUrl(fileName);

      if(urlError){
        console.error(urlError);
        alert("❌ خطأ أثناء الحصول على رابط الصورة");
        return;
      }

      image_url = publicUrl;
    } catch(err){
      console.error(err);
      alert("❌ حدث خطأ غير متوقع أثناء رفع الصورة");
      return;
    }
  }

  // إضافة العرض إلى جدول offers
  const { data: insertData, error: insertError } = await supabase
    .from('offers')
    .insert([{
      title,
      description,
      discount: discount || null,
      image_url
    }]);

  if(insertError){
    console.error(insertError);
    alert("❌ حدث خطأ أثناء إضافة العرض");
  } else {
    alert("✅ تم إضافة العرض بنجاح!");
    // مسح الحقول
    document.getElementById("offerTitle").value = "";
    document.getElementById("offerDesc").value = "";
    document.getElementById("offerDiscount").value = "";
    document.getElementById("offerImageFile").value = "";
  }
}
</script>

</body>
</html>
